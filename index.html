<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Desi Truck Simulator - Scenic Indian Highway (NH 44)</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --hud-surface: rgba(13, 18, 22, 0.92);
                --hud-surface-raised: rgba(23, 29, 34, 0.96);
                --hud-surface-pressed: rgba(8, 12, 15, 0.98);
                --hud-text: #f7f8f5;
                --hud-muted: #b8c0c4;
                --hud-amber: #ffc15a;
                --hud-amber-strong: #ffad2f;
                --hud-green: #45c96b;
                --hud-green-surface: #163b25;
                --hud-green-border: #3fbf65;
                --hud-border: rgba(232, 238, 240, 0.22);
                --hud-border-strong: rgba(247, 248, 245, 0.42);
                --hud-radius-sm: 6px;
                --hud-radius: 10px;
                --hud-transition: 180ms cubic-bezier(0.25, 1, 0.5, 1);
                --space-1: 4px;
                --space-2: 8px;
                --space-3: 12px;
                --space-4: 16px;
                --space-5: 20px;
                --space-6: 24px;
                --space-8: 32px;
            }

            * {
                box-sizing: border-box;
                user-select: none;
                margin: 0;
                padding: 0;
            }
            body,
            html {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background-color: #12161a;
                font-family: "Outfit", sans-serif;
                color: #fff;
            }
            #canvas-container {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
            }
            #canvas-container canvas {
                display: block;
                width: 100%;
                height: 100%;
                cursor: grab;
            }

            /* Modern truck instrument panel */
            .hud-overlay {
                position: absolute;
                inset: 0;
                z-index: 10;
                pointer-events: none;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: var(--space-6) var(--space-8);
            }

            .top-bar {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
            }

            .game-brand {
                pointer-events: auto;
                padding: 9px 12px 8px;
                background: var(--hud-surface);
                border-top: 2px solid var(--hud-amber);
                border-radius: 0 0 var(--hud-radius-sm) var(--hud-radius-sm);
                box-shadow: 0 3px 8px rgba(0, 0, 0, 0.28);
            }
            .brand-title {
                font-size: 20px;
                font-weight: 800;
                line-height: 1;
                letter-spacing: 1.6px;
                text-transform: uppercase;
                color: var(--hud-amber);
            }
            .brand-sub {
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.8px;
                color: var(--hud-muted);
                text-transform: uppercase;
                margin-top: 4px;
            }

            .top-controls {
                display: flex;
                gap: var(--space-2);
                pointer-events: auto;
            }

            .hud-btn {
                background: var(--hud-surface);
                border: 1px solid var(--hud-border);
                color: var(--hud-text);
                width: 40px;
                height: 40px;
                min-height: 40px;
                padding: 0;
                border-radius: var(--hud-radius-sm);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
                transition:
                    color var(--hud-transition),
                    background-color var(--hud-transition),
                    border-color var(--hud-transition),
                    transform var(--hud-transition);
                outline: none;
                user-select: none;
            }
            .hud-btn:focus,
            .touch-btn:focus {
                outline: none;
            }
            .hud-btn:focus-visible,
            .touch-btn:focus-visible {
                outline: 2px solid var(--hud-amber);
                outline-offset: 2px;
            }
            .hud-btn:hover {
                background: var(--hud-surface-raised);
                border-color: var(--hud-border-strong);
                color: var(--hud-amber);
                transform: translateY(-1px);
            }
            .hud-btn:active {
                background: var(--hud-surface-pressed);
                border-color: var(--hud-amber-strong);
                transform: translateY(1px);
            }
            .hud-icon {
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }
            .hud-btn .lucide {
                width: 18px;
                height: 18px;
                stroke-width: 2.2px;
            }

            /* Bottom HUD section */
            .bottom-bar {
                display: grid;
                grid-template-columns: minmax(280px, 1fr) auto minmax(
                        280px,
                        1fr
                    );
                align-items: flex-end;
                gap: var(--space-6);
            }

            .speed-cluster {
                display: flex;
                align-items: baseline;
                gap: 8px;
                font-family: "JetBrains Mono", monospace;
            }
            .speed-val {
                font-size: 56px;
                font-weight: 700;
                letter-spacing: -2px;
                color: var(--hud-text);
                font-variant-numeric: tabular-nums;
                text-shadow: 0 3px 8px rgba(0, 0, 0, 0.68);
                line-height: 1;
            }
            .speed-unit {
                font-size: 14px;
                color: var(--hud-muted);
                text-transform: uppercase;
                font-weight: 600;
            }

            .metrics-box {
                background: var(--hud-surface);
                border: 1px solid var(--hud-border);
                border-radius: var(--hud-radius);
                padding: 14px 20px;
                display: flex;
                gap: 24px;
                align-items: center;
                font-family: "JetBrains Mono", monospace;
                box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
                justify-self: center;
            }
            .metric-item {
                display: flex;
                flex-direction: column;
            }
            .metric-item + .metric-item {
                padding-left: 24px;
                border-left: 1px solid var(--hud-border);
            }
            .metric-label {
                display: flex;
                align-items: center;
                gap: 5px;
                font-size: 10px;
                color: var(--hud-muted);
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            .metric-label .lucide {
                width: 12px;
                height: 12px;
                stroke-width: 2px;
                color: var(--hud-amber);
            }
            .metric-val {
                font-size: 16px;
                font-weight: 600;
                color: var(--hud-amber);
                margin-top: 2px;
                font-variant-numeric: tabular-nums;
            }

            .controls-hint {
                background: var(--hud-surface);
                border: 1px solid var(--hud-border);
                border-radius: var(--hud-radius);
                padding: var(--space-3) var(--space-4);
                font-size: 10px;
                font-weight: 400;
                color: var(--hud-muted);
                line-height: 1.35;
                box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
                display: grid;
                grid-template-columns: repeat(3, minmax(112px, 1fr));
                gap: var(--space-2) var(--space-3);
                justify-self: end;
            }
            .control-row {
                display: grid;
                grid-template-columns: minmax(40px, auto) 8px 1fr;
                align-items: center;
                gap: var(--space-1);
                white-space: nowrap;
            }
            .control-row::before {
                content: "\2014";
                grid-column: 2;
                grid-row: 1;
                color: rgba(247, 248, 245, 0.38);
                text-align: center;
            }
            .control-keys {
                grid-column: 1;
                grid-row: 1;
                display: flex;
                justify-content: flex-end;
                align-items: center;
                gap: 2px;
            }
            .control-action {
                grid-column: 3;
                grid-row: 1;
                color: var(--hud-muted);
            }
            .key-badge {
                display: inline-block;
                padding: 1px 6px;
                background: #2b3338;
                border: 1px solid rgba(247, 248, 245, 0.22);
                border-radius: 3px;
                font-weight: 600;
                color: var(--hud-text);
                font-family: "JetBrains Mono", monospace;
                font-size: 10px;
                margin: 0;
            }

            /* Onscreen touch controls for mobile/tablet */
            .touch-controls {
                display: none;
                position: absolute;
                bottom: 24px;
                left: 0;
                right: 0;
                padding: 0 24px;
                justify-content: space-between;
                pointer-events: none;
                z-index: 20;
            }
            .touch-dpad,
            .touch-pedals {
                display: flex;
                gap: 12px;
                pointer-events: auto;
            }
            .touch-btn {
                width: 58px;
                height: 58px;
                border-radius: 50%;
                background: var(--hud-surface-raised);
                border: 2px solid var(--hud-border-strong);
                color: var(--hud-text);
                font-size: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                touch-action: none;
                box-shadow:
                    inset 0 0 0 3px rgba(0, 0, 0, 0.22),
                    0 3px 8px rgba(0, 0, 0, 0.34);
                transition:
                    color var(--hud-transition),
                    background-color var(--hud-transition),
                    border-color var(--hud-transition),
                    transform var(--hud-transition);
            }
            .touch-btn:active {
                background: #493315;
                border-color: var(--hud-amber);
                color: var(--hud-amber);
                transform: scale(0.94);
            }

            .touch-btn .lucide {
                width: 26px;
                height: 26px;
                stroke-width: 2.5px;
            }

            .autopilot-indicator {
                position: absolute;
                top: 80px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--hud-green-surface);
                border: 1px solid var(--hud-green-border);
                color: #effff3;
                padding: 8px 20px;
                border-radius: var(--hud-radius-sm);
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 1.5px;
                display: flex;
                align-items: center;
                gap: 8px;
                pointer-events: none;
                z-index: 15;
                box-shadow: 0 3px 8px rgba(0, 0, 0, 0.34);
            }
            .autopilot-indicator .lucide {
                width: 16px;
                height: 16px;
            }
            .hud-btn.autopilot-active {
                background: var(--hud-green-surface);
                border-color: var(--hud-green-border);
                color: #effff3;
            }
            .hud-btn.autopilot-active:hover {
                background: #1b4a2e;
                border-color: var(--hud-green);
                color: #ffffff;
            }
            .hud-btn.headlights-active {
                background: #493315;
                border-color: var(--hud-amber-strong);
                color: var(--hud-amber);
            }
            .hud-btn.headlights-active:hover {
                background: #5b4019;
                border-color: var(--hud-amber);
                color: #ffe1ad;
            }

            @media (max-width: 1199px) {
                .bottom-bar {
                    grid-template-columns: 1fr auto;
                    gap: var(--space-3) var(--space-6);
                }
                .controls-hint {
                    grid-column: 1 / -1;
                    grid-row: 1;
                    justify-self: stretch;
                }
                .speed-cluster {
                    grid-column: 1;
                    grid-row: 2;
                }
                .metrics-box {
                    grid-column: 2;
                    grid-row: 2;
                }
            }

            @media (max-width: 768px) {
                .hud-overlay {
                    padding: var(--space-4);
                    padding-bottom: calc(
                        env(safe-area-inset-bottom, 0px) + 110px
                    );
                }
                .top-bar {
                    gap: var(--space-3);
                }
                .game-brand {
                    padding: var(--space-2);
                }
                .brand-title {
                    font-size: 16px;
                    letter-spacing: 1px;
                }
                .brand-sub {
                    max-width: 132px;
                    font-size: 8px;
                    line-height: 1.2;
                    letter-spacing: 0.55px;
                }
                .top-controls {
                    display: grid;
                    grid-template-columns: repeat(3, 44px);
                    gap: var(--space-1);
                }
                .hud-btn {
                    width: 44px;
                    height: 44px;
                    min-height: 44px;
                }
                .controls-hint {
                    display: none;
                }
                .bottom-bar {
                    grid-template-columns: 1fr auto;
                    gap: var(--space-4);
                }
                .speed-cluster {
                    grid-row: 1;
                }
                .speed-val {
                    font-size: 40px;
                }
                .speed-unit {
                    font-size: 11px;
                }
                .metrics-box {
                    grid-row: 1;
                    padding: var(--space-2) var(--space-3);
                }
                .metric-item:not(:first-child) {
                    display: none;
                }
                .touch-controls {
                    display: flex;
                    bottom: calc(
                        env(safe-area-inset-bottom, 0px) + var(--space-6)
                    );
                }
                .autopilot-indicator {
                    top: 124px;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .hud-btn,
                .touch-btn {
                    transition-duration: 0.01ms;
                }
            }
        </style>
    </head>
    <body>
        <div id="canvas-container"></div>

        <div class="hud-overlay">
            <div class="top-bar">
                <div class="game-brand">
                    <div class="brand-title">DESI TRUCK</div>
                    <div class="brand-sub">HORN OK PLEASE &bull; NH 44</div>
                </div>

                <div class="top-controls">
                    <button
                        id="btn-horn"
                        class="hud-btn"
                        tabindex="-1"
                        title="Blow Pressure Horn (H)"
                        aria-label="Blow Pressure Horn (H)"
                    >
                        <span class="hud-icon" id="horn-icon"
                            ><i data-lucide="volume-2"></i
                        ></span>
                    </button>
                    <button
                        id="btn-theme"
                        class="hud-btn"
                        tabindex="-1"
                        title="Toggle Lighting Preset (T)"
                        aria-label="Toggle Lighting Preset (T)"
                    >
                        <span class="hud-icon" id="theme-icon"
                            ><i data-lucide="sun"></i
                        ></span>
                    </button>
                    <button
                        id="btn-headlights"
                        class="hud-btn headlights-active"
                        tabindex="-1"
                        title="Turn Off Headlights (L)"
                        aria-label="Turn headlights off"
                        aria-pressed="true"
                    >
                        <span class="hud-icon" id="headlights-icon"
                            ><i data-lucide="lightbulb"></i
                        ></span>
                    </button>
                    <button
                        id="btn-camera"
                        class="hud-btn"
                        tabindex="-1"
                        title="Switch Camera (C)"
                        aria-label="Switch Camera (C)"
                    >
                        <span class="hud-icon" id="cam-icon"
                            ><i data-lucide="camera"></i
                        ></span>
                    </button>
                    <button
                        id="btn-reset"
                        class="hud-btn"
                        tabindex="-1"
                        title="Reset Truck Position (R)"
                        aria-label="Reset Truck Position (R)"
                    >
                        <span class="hud-icon" id="reset-icon"
                            ><i data-lucide="rotate-ccw"></i
                        ></span>
                    </button>
                    <button
                        id="btn-autopilot"
                        class="hud-btn"
                        tabindex="-1"
                        title="Toggle Autopilot (P)"
                        aria-label="Toggle Autopilot (P)"
                        aria-pressed="false"
                    >
                        <span class="hud-icon" id="autopilot-btn-icon"
                            ><i data-lucide="navigation"></i
                        ></span>
                    </button>
                </div>
            </div>

            <!--<div
                id="autopilot-indicator"
                class="autopilot-indicator"
                style="display: none"
            >
                <span class="hud-icon"><i data-lucide="navigation"></i></span>
                AUTOPILOT ACTIVE <span class="key-badge">P</span> to disengage
            </div>-->

            <div class="bottom-bar">
                <div class="speed-cluster">
                    <span id="hud-speed" class="speed-val">0</span>
                    <span class="speed-unit">KM/H</span>
                </div>

                <dl class="controls-hint" aria-label="Keyboard controls">
                    <div class="control-row">
                        <dt class="control-keys">
                            <span class="key-badge">W</span
                            ><span class="key-badge">↑</span>
                        </dt>
                        <dd class="control-action">Drive</dd>
                    </div>
                    <div class="control-row">
                        <dt class="control-keys">
                            <span class="key-badge">S</span
                            ><span class="key-badge">↓</span>
                        </dt>
                        <dd class="control-action">Brake</dd>
                    </div>
                    <div class="control-row">
                        <dt class="control-keys">
                            <span class="key-badge">A/D</span>
                        </dt>
                        <dd class="control-action">Steer</dd>
                    </div>
                    <div class="control-row">
                        <dt class="control-keys">
                            <span class="key-badge">SPACE</span>
                        </dt>
                        <dd class="control-action">Handbrake</dd>
                    </div>
                    <div class="control-row">
                        <dt class="control-keys">
                            <span class="key-badge">H</span>
                        </dt>
                        <dd class="control-action">Horn</dd>
                    </div>
                    <div class="control-row">
                        <dt class="control-keys">
                            <span class="key-badge">L</span>
                        </dt>
                        <dd class="control-action">Headlights</dd>
                    </div>
                    <div class="control-row">
                        <dt class="control-keys">
                            <span class="key-badge">C</span>
                        </dt>
                        <dd class="control-action">Camera</dd>
                    </div>
                    <div class="control-row">
                        <dt class="control-keys">
                            <span class="key-badge">R</span>
                        </dt>
                        <dd class="control-action">Reset</dd>
                    </div>
                    <div class="control-row">
                        <dt class="control-keys">
                            <span class="key-badge">P</span>
                        </dt>
                        <dd class="control-action">Autopilot</dd>
                    </div>
                </dl>
            </div>
        </div>

        <div class="touch-controls">
            <div class="touch-dpad">
                <button class="touch-btn" id="btn-left" tabindex="-1">
                    <i data-lucide="chevron-left"></i>
                </button>
                <button class="touch-btn" id="btn-right" tabindex="-1">
                    <i data-lucide="chevron-right"></i>
                </button>
            </div>
            <div class="touch-pedals">
                <button class="touch-btn" id="btn-brake" tabindex="-1">
                    <i data-lucide="chevron-down"></i>
                </button>
                <button class="touch-btn" id="btn-gas" tabindex="-1">
                    <i data-lucide="chevron-up"></i>
                </button>
            </div>
        </div>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
