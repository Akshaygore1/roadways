<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rajasthan Express · 3D truck</title>
<style>body{margin:0;background:#e8e5df;font:14px system-ui;color:#243239}canvas{display:block}header{position:absolute;top:30px;left:36px}h1{font-size:28px;margin:6px 0}small{letter-spacing:3px}footer{position:absolute;bottom:25px;left:36px}a,button{color:inherit;background:#fff9;border:1px solid #9aa4a4;padding:10px 16px;border-radius:4px;text-decoration:none;font:inherit;cursor:pointer}nav{position:absolute;right:30px;top:35px;display:flex;gap:8px}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head>
<body><header><small>INDIAN HIGHWAYS / 01</small><h1>Rajasthan Express</h1><span>A decorated three-axle cargo truck</span></header><nav><button id="rotate">Pause rotation</button><a href="indian-truck.json" download>Download model</a></nav><footer>Drag to orbit · Scroll to zoom · Right-drag to pan</footer>
<script type="module">
import * as T from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const scene=new T.Scene();scene.background=new T.Color('#e8e5df');
const camera=new T.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);camera.position.set(12,8,14);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.8,0);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=.6;
scene.add(new T.HemisphereLight(0xe7f4ff,0x927457,3));const sun=new T.DirectionalLight(0xffeedb,4);sun.position.set(6,12,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8});sun.shadow.bias=-.001;scene.add(sun);
const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:0xe8e5df,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
new T.ObjectLoader().load('./indian-truck.json',truck=>scene.add(truck),undefined,error=>{document.querySelector('h1').textContent='Model failed to load';console.error(error);});
document.querySelector('#rotate').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.target.textContent=controls.autoRotate?'Pause rotation':'Rotate model';};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script></body></html>
