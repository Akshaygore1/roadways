<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <meta property="og:site_name" content="Desi Roads" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --charcoal: #22241f;
        --charcoal-deep: #151713;
        --charcoal-raised: #303229;
        --marigold: #ffc15a;
        --cream: #fff3d3;
        --cream-muted: #d8d0b8;
        --teal: #4f9d91;
        --line: rgba(255, 243, 211, 0.24);
        --line-strong: rgba(255, 193, 90, 0.64);
        --ease: 180ms cubic-bezier(0.25, 1, 0.5, 1);
        --edge-x: clamp(14px, 2.2vw, 32px);
        --edge-y: clamp(14px, 2.4vh, 24px);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--charcoal-deep); color: var(--cream); font-family: "Outfit", sans-serif; }
      button, a { font: inherit; }
      #canvas-container { position: absolute; inset: 0; z-index: 1; }
      #canvas-container canvas { display: block; width: 100%; height: 100%; cursor: grab; }
      .hud-overlay { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; padding: var(--edge-y) var(--edge-x); pointer-events: none; }
      .top-bar, .bottom-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
      .top-left-hud { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
      .game-brand { position: relative; display: flex; align-items: stretch; min-height: 48px; overflow: hidden; background: var(--marigold); color: #191811; border: 2px solid #2b2a21; border-radius: 2px; box-shadow: 0 4px 0 rgba(21, 23, 19, 0.8); }
      .game-brand::before, .game-brand::after { content: ""; position: absolute; top: 7px; width: 4px; height: 4px; border-radius: 50%; background: rgba(25, 24, 17, 0.55); }
      .game-brand::before { left: 7px; }
      .game-brand::after { right: 7px; }
      .brand-title { display: flex; align-items: center; padding: 0 17px 0 15px; font-size: 18px; font-weight: 800; letter-spacing: 0.08em; line-height: 1; white-space: nowrap; }
      .brand-route { display: flex; align-items: center; margin: 6px; padding: 0 9px; background: var(--charcoal); color: var(--cream); border: 1px solid rgba(25, 24, 17, 0.5); border-radius: 2px; font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; white-space: nowrap; }
      .music-player { --music-tuner-position: 12.5%; position: relative; width: 218px; color: var(--cream); pointer-events: auto; }
      .music-player-toggle, .top-controls, .music-player-panel, .instrument-panel, .controls-hint { background: rgba(34, 36, 31, 0.95); border: 1px solid var(--line-strong); border-radius: 3px; box-shadow: 0 4px 0 rgba(12, 13, 11, 0.56); }
      .music-player-toggle { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 38px; padding: 0 10px; color: var(--cream); cursor: pointer; transition: background-color var(--ease), border-color var(--ease); }
      .music-player-toggle:hover { background: var(--charcoal-raised); border-color: var(--marigold); }
      .music-live-dot { width: 7px; height: 7px; flex: 0 0 auto; background: var(--teal); border: 1px solid var(--cream); border-radius: 50%; }
      .music-player-name { font-size: 10px; font-weight: 800; letter-spacing: 0.075em; white-space: nowrap; }
      .music-player-current { min-width: 0; flex: 1; overflow: hidden; color: var(--cream-muted); font-family: "JetBrains Mono", monospace; font-size: 8px; font-weight: 600; text-align: right; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
      .music-player-chevron { width: 7px; height: 7px; flex: 0 0 auto; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform var(--ease); }
      .music-player.is-expanded .music-player-chevron { transform: translateY(2px) rotate(225deg); }
      .music-player-panel { position: absolute; z-index: 20; top: calc(100% + 7px); left: 0; width: 364px; padding: 12px; animation: radio-in var(--ease) both; }
      .music-player-panel[hidden] { display: none; }
      .music-tuner-head { display: flex; justify-content: space-between; margin-bottom: 9px; font: 600 8px "JetBrains Mono", monospace; letter-spacing: 0.09em; text-transform: uppercase; }
      .music-tuner-label { color: var(--cream-muted); }
      .music-tuner-band { color: var(--marigold); }
      .music-moods { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: 16px; }
      .music-moods::after { content: ""; position: absolute; right: 8px; bottom: 7px; left: 8px; height: 1px; background: var(--line); }
      .music-mood { min-width: 0; min-height: 44px; padding: 4px; background: transparent; border: 0; border-radius: 2px; color: var(--cream-muted); cursor: pointer; transition: color var(--ease), background-color var(--ease); }
      .music-mood:hover { background: rgba(255, 193, 90, 0.1); color: var(--cream); }
      .music-mood.is-selected { color: var(--marigold); }
      .music-mood-name { display: block; overflow: hidden; font-size: 10px; font-weight: 700; line-height: 1.1; text-overflow: ellipsis; white-space: nowrap; }
      .music-frequency { display: block; margin-top: 4px; font: 600 7px "JetBrains Mono", monospace; }
      .music-tuning-marker { position: absolute; z-index: 1; bottom: 3px; left: var(--music-tuner-position); width: 8px; height: 8px; background: var(--marigold); transform: translateX(-50%) rotate(45deg); transition: left 220ms cubic-bezier(0.25, 1, 0.5, 1); }
      .music-player-embed { display: block; width: 100%; height: 152px; margin-top: 8px; border: 0; border-radius: 3px; background: #171717; }
      .music-player-foot { display: flex; justify-content: flex-end; margin-top: 7px; }
      .music-player-fallback { color: var(--cream-muted); font: 600 9px "JetBrains Mono", monospace; text-decoration-color: var(--marigold); text-underline-offset: 3px; user-select: text; }
      .music-player-fallback:hover { color: var(--marigold); }
      .top-controls { display: flex; gap: 2px; padding: 4px; pointer-events: auto; }
      .hud-btn { position: relative; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; background: rgba(255, 243, 211, 0.04); border: 0; border-radius: 2px; color: var(--cream); cursor: pointer; transition: color var(--ease), background-color var(--ease), transform var(--ease); }
      .hud-btn::after { content: attr(data-key); position: absolute; right: 4px; bottom: 3px; color: rgba(255, 243, 211, 0.64); font: 600 7px "JetBrains Mono", monospace; line-height: 1; }
      .hud-btn:hover { background: rgba(255, 193, 90, 0.13); color: var(--marigold); }
      .hud-btn:active { background: rgba(255, 193, 90, 0.22); transform: translateY(1px); }
      .hud-icon { display: inline-flex; align-items: center; justify-content: center; }
      .hud-btn .lucide { width: 18px; height: 18px; stroke-width: 2.2px; }
      .hud-btn.autopilot-active { background: rgba(79, 157, 145, 0.24); color: #dffff8; box-shadow: inset 0 -3px var(--teal); }
      .hud-btn.headlights-active { background: rgba(255, 193, 90, 0.2); color: var(--marigold); box-shadow: inset 0 -3px var(--marigold); }
      .hud-btn.truck-sound-muted { background: rgba(216, 208, 184, 0.06); color: var(--cream-muted); box-shadow: inset 0 -3px rgba(216, 208, 184, 0.45); }
      .hud-btn.truck-sound-muted .lucide { opacity: 0.72; }
      .autopilot-indicator { position: absolute; top: var(--edge-y); left: 50%; z-index: 15; display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 13px; background: #263b35; border: 1px solid #83b1a5; border-radius: 3px; color: #effffb; font: 700 10px "JetBrains Mono", monospace; letter-spacing: 0.08em; transform: translateX(-50%); box-shadow: 0 4px 0 rgba(12, 13, 11, 0.48); pointer-events: none; }
      .autopilot-indicator .lucide { width: 15px; height: 15px; }
      .bottom-bar { align-items: flex-end; }
      .instrument-panel { position: relative; display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; min-width: 268px; overflow: hidden; pointer-events: none; }
      .instrument-panel::before { content: ""; position: absolute; top: 0; right: 0; width: 42px; height: 4px; background: var(--marigold); }
      .speed-cluster { grid-row: 1 / 3; display: flex; align-items: flex-end; gap: 6px; padding: 12px 16px 11px 14px; border-right: 1px solid var(--line); font-family: "JetBrains Mono", monospace; }
      .speed-val { color: var(--cream); font-size: 49px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.04em; line-height: 0.86; }
      .speed-unit { padding-bottom: 2px; color: var(--marigold); font-size: 10px; font-weight: 700; letter-spacing: 0.06em; }
      .route-strip, .telemetry-strip { display: flex; align-items: center; justify-content: space-between; gap: 15px; min-width: 145px; padding: 7px 11px; font-family: "JetBrains Mono", monospace; }
      .route-strip { border-bottom: 1px solid var(--line); }
      .metric { display: flex; flex-direction: column; gap: 1px; }
      .metric-label { color: var(--cream-muted); font-size: 7px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
      .metric-value { color: var(--cream); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
      #hud-nh { color: var(--marigold); }
      #hud-fps { color: #b8d2a4; }
      .controls-hint { width: 220px; padding: 0 11px 9px; color: var(--cream-muted); }
      .controls-hint::before { content: "NH 44 · DRIVER LEDGER"; display: block; margin: 0 -11px 4px; padding: 8px 11px 7px; background: rgba(255, 193, 90, 0.12); border-bottom: 1px solid rgba(255, 193, 90, 0.3); color: var(--marigold); font: 700 8px "JetBrains Mono", monospace; letter-spacing: 0.1em; }
      .control-row { display: grid; grid-template-columns: 1fr auto; align-items: center; min-height: 27px; gap: 10px; border-bottom: 1px solid rgba(255, 243, 211, 0.09); }
      .control-row:last-child { border-bottom: 0; }
      .control-keys { display: flex; gap: 4px; }
      .control-action { color: var(--cream); font-size: 10px; font-weight: 600; }
      .key-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 23px; height: 19px; padding: 0 5px; background: rgba(255, 243, 211, 0.08); border: 1px solid rgba(255, 243, 211, 0.3); border-radius: 2px; color: var(--cream); font: 600 8px "JetBrains Mono", monospace; }
      .touch-controls { position: absolute; right: 0; bottom: 0; left: 0; z-index: 20; display: none; justify-content: space-between; padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 18px); pointer-events: none; }
      .touch-dpad, .touch-pedals { display: flex; gap: 10px; pointer-events: auto; }
      .touch-btn { position: relative; display: flex; align-items: center; justify-content: center; width: 62px; height: 62px; touch-action: none; background: var(--charcoal); border: 2px solid var(--marigold); border-radius: 4px; color: var(--cream); box-shadow: 0 5px 0 rgba(14, 15, 12, 0.7); transition: color var(--ease), background-color var(--ease), transform var(--ease); }
      .touch-btn::after { content: attr(aria-label); position: absolute; bottom: 4px; font: 700 7px "JetBrains Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; }
      .touch-btn .lucide { width: 25px; height: 25px; transform: translateY(-5px); }
      .touch-btn:active { background: #553b18; color: var(--marigold); transform: translateY(2px); }
      .hud-btn:focus { outline: none; }
      .hud-btn:focus-visible, .touch-btn:focus-visible, .music-player-toggle:focus-visible, .music-mood:focus-visible, .music-player-fallback:focus-visible { outline: 3px solid var(--cream); outline-offset: 2px; }
      @keyframes radio-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
      @media (max-width: 1024px) { .controls-hint { width: 196px; } .control-row { min-height: 25px; } }
      @media (min-width: 769px) and (max-width: 900px) { .autopilot-indicator { top: calc(var(--edge-y) + 60px); } }
      @media (max-width: 768px) {
        .hud-overlay { padding: 12px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); }
        .top-bar { gap: 10px; }
        .top-left-hud { gap: 6px; }
        .game-brand { min-height: 42px; }
        .brand-title { padding: 0 10px; font-size: 14px; letter-spacing: 0.06em; }
        .brand-route { margin: 5px; padding: 0 7px; font-size: 8px; }
        .music-player { width: 178px; }
        .music-player-toggle { min-height: 34px; padding: 0 8px; }
        .music-player-name { font-size: 9px; }
        .music-player-current { font-size: 7px; }
        .music-player.is-expanded { position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); left: 12px; width: auto; max-width: 420px; margin-inline: auto; }
        .music-player.is-expanded .music-player-panel { position: static; width: 100%; max-height: calc(100dvh - env(safe-area-inset-bottom, 0px) - 210px); margin-top: 6px; overflow-y: auto; overscroll-behavior: contain; }
        .top-controls { display: grid; grid-template-columns: repeat(3, 44px); gap: 2px; padding: 3px; }
        .controls-hint { display: none; }
        .instrument-panel { min-width: 236px; }
        .speed-cluster { padding: 10px 12px 9px 10px; }
        .speed-val { font-size: 40px; }
        .route-strip, .telemetry-strip { min-width: 126px; padding: 6px 8px; gap: 9px; }
        .touch-controls { display: flex; }
        .autopilot-indicator { top: calc(var(--edge-y) + 148px); bottom: auto; min-height: 34px; padding: 0 10px; font-size: 9px; }
      }
      @media (max-width: 480px) {
        .game-brand { min-height: 38px; }
        .brand-title { font-size: 12px; }
        .brand-route { font-size: 7px; }
        .music-player { width: 180px; }
        .music-player-name { font-size: 8px; }
        .music-player-current { display: none; }
        .top-controls { grid-template-columns: repeat(3, 42px); }
        .hud-btn { width: 42px; height: 42px; }
        .instrument-panel { min-width: 220px; }
        .speed-val { font-size: 36px; }
        .route-strip, .telemetry-strip { min-width: 119px; }
        .touch-btn { width: 58px; height: 58px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .hud-btn, .touch-btn, .music-player-toggle, .music-player-chevron, .music-mood, .music-tuning-marker { transition-duration: 0.01ms; }
        .music-player-panel { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div class="hud-overlay">
      <div class="top-bar">
        <div class="top-left-hud">
          <div class="game-brand" aria-label="Desi Roads, route NH 44"><div class="brand-title">DESI ROADS</div><div class="brand-route">NH 44</div></div>
          <section id="music-player" class="music-player" aria-label="DESI ROADS RADIO Spotify radio">
            <button id="music-player-toggle" class="music-player-toggle" type="button" aria-expanded="false" aria-controls="music-player-panel" aria-label="Open DESI ROADS RADIO, Highway selected">
              <span class="music-live-dot" aria-hidden="true"></span><span class="music-player-name">DESI ROADS RADIO</span><span id="music-player-current" class="music-player-current">Highway</span><span class="music-player-chevron" aria-hidden="true"></span>
            </button>
            <div id="music-player-panel" class="music-player-panel" hidden>
              <div class="music-tuner-head" aria-hidden="true"><span class="music-tuner-label">Tune your route</span><span class="music-tuner-band">FM / Playlist</span></div>
              <div class="music-moods" role="tablist" aria-label="Choose a music mood">
                <button class="music-mood is-selected" type="button" role="tab" data-music-mood="highway" aria-selected="true" aria-controls="music-player-embed"><span class="music-mood-name">Highway</span><span class="music-frequency">88.1</span></button>
                <button class="music-mood" type="button" role="tab" data-music-mood="80s-bollywood" aria-selected="false" aria-controls="music-player-embed" tabindex="-1"><span class="music-mood-name">80s Bollywood</span><span class="music-frequency">93.5</span></button>
                <button class="music-mood" type="button" role="tab" data-music-mood="punjabi" aria-selected="false" aria-controls="music-player-embed" tabindex="-1"><span class="music-mood-name">Punjabi</span><span class="music-frequency">101.2</span></button>
                <button class="music-mood" type="button" role="tab" data-music-mood="90s-bollywood" aria-selected="false" aria-controls="music-player-embed" tabindex="-1"><span class="music-mood-name">90s Bollywood</span><span class="music-frequency">106.4</span></button>
                <span class="music-tuning-marker" aria-hidden="true"></span>
              </div>
              <iframe id="music-player-embed" class="music-player-embed" title="Spotify player: Highway" loading="lazy" allow="clipboard-write; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
              <div class="music-player-foot"><a id="music-player-fallback" class="music-player-fallback" href="https://open.spotify.com/playlist/1fZoi2cNS8YfDKp5qzukyZ" target="_blank" rel="noopener noreferrer">Open in Spotify ↗</a></div>
            </div>
          </section>
        </div>
        <div class="top-controls" aria-label="Simulator controls">
          <button id="btn-horn" class="hud-btn" data-key="H" title="Blow Pressure Horn (H)" aria-label="Blow Pressure Horn (H)"><span class="hud-icon" id="horn-icon"><i data-lucide="megaphone"></i></span></button>
          <button id="btn-truck-sound" class="hud-btn truck-sound-active" data-key="M" title="Mute Truck Sound (M)" aria-label="Mute truck sound" aria-pressed="true"><span class="hud-icon" id="truck-sound-icon"><i data-lucide="volume-2"></i></span></button>
          <button id="btn-theme" class="hud-btn" data-key="T" title="Toggle Lighting Preset (T)" aria-label="Toggle Lighting Preset (T)"><span class="hud-icon" id="theme-icon"><i data-lucide="sun"></i></span></button>
          <button id="btn-headlights" class="hud-btn headlights-active" data-key="L" title="Turn Off Headlights (L)" aria-label="Turn headlights off" aria-pressed="true"><span class="hud-icon" id="headlights-icon"><i data-lucide="lightbulb"></i></span></button>
          <button id="btn-camera" class="hud-btn" data-key="C" title="Switch Camera (C)" aria-label="Switch Camera (C)"><span class="hud-icon" id="cam-icon"><i data-lucide="camera"></i></span></button>
          <button id="btn-reset" class="hud-btn" data-key="R" title="Reset Truck Position (R)" aria-label="Reset Truck Position (R)"><span class="hud-icon" id="reset-icon"><i data-lucide="rotate-ccw"></i></span></button>
          <button id="btn-autopilot" class="hud-btn" data-key="P" title="Toggle Autopilot (P)" aria-label="Engage Autopilot" aria-pressed="false"><span class="hud-icon" id="autopilot-btn-icon"><i data-lucide="navigation"></i></span></button>
        </div>
      </div>
      <div id="autopilot-indicator" class="autopilot-indicator" style="display: none" role="status"><span class="hud-icon"><i data-lucide="navigation"></i></span><span>AUTOPILOT ACTIVE</span><span class="key-badge">P</span></div>
      <div class="bottom-bar">
        <section class="instrument-panel" aria-label="Driving telemetry">
          <div class="speed-cluster"><span id="hud-speed" class="speed-val">0</span><span class="speed-unit">KM/H</span></div>
          <div class="route-strip"><span class="metric"><span class="metric-label">Route</span><span id="hud-nh" class="metric-value">NH 44</span></span><span class="metric"><span class="metric-label">Distance</span><span id="hud-distance" class="metric-value">0.0 KM</span></span></div>
          <div class="telemetry-strip"><span class="metric"><span class="metric-label">Status</span><span class="metric-value">ON ROAD</span></span><span class="metric"><span class="metric-label">FPS</span><span id="hud-fps" class="metric-value">60</span></span></div>
        </section>
        <dl class="controls-hint" aria-label="Keyboard controls">
          <div class="control-row"><dt class="control-keys"><span class="key-badge">W</span><span class="key-badge">↑</span></dt><dd class="control-action">Drive</dd></div>
          <div class="control-row"><dt class="control-keys"><span class="key-badge">S</span><span class="key-badge">↓</span></dt><dd class="control-action">Brake</dd></div>
          <div class="control-row"><dt class="control-keys"><span class="key-badge">A/D</span><span class="key-badge">←/→</span></dt><dd class="control-action">Steer</dd></div>
          <div class="control-row"><dt class="control-keys"><span class="key-badge">SPACE</span></dt><dd class="control-action">Handbrake</dd></div>
          <div class="control-row"><dt class="control-keys"><span class="key-badge">H</span></dt><dd class="control-action">Horn</dd></div>
          <div class="control-row"><dt class="control-keys"><span class="key-badge">M</span></dt><dd class="control-action">Truck Sound</dd></div>
          <div class="control-row"><dt class="control-keys"><span class="key-badge">L</span></dt><dd class="control-action">Headlights</dd></div>
          <div class="control-row"><dt class="control-keys"><span class="key-badge">C</span></dt><dd class="control-action">Camera</dd></div>
          <div class="control-row"><dt class="control-keys"><span class="key-badge">R</span></dt><dd class="control-action">Reset</dd></div>
